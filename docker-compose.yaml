services:

  bruttice-backend:
    depends_on:
      bruttice-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: bruttice-backend
    pull_policy: never
    container_name: bruttice-backend
    init: true
    volumes:
      - ./apps/backend/config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    networks:
      - bruttice

  bruttice-frontend:
    build:
      context: apps/frontend
    image: bruttice-frontend
    pull_policy: never
    container_name: bruttice-frontend
    init: true
    env_file:
      - .env
    networks:
      - bruttice

  bruttice-db:
    image: postgres:18
    container_name: bruttice-db
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - ${PG_DATA_PATH}:${PG_DATA}:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U postgres"]
      timeout: 30s
      retries: 10
      start_period: 5s
    networks:
      - bruttice

  bruttice-nginx:
    depends_on:
      bruttice-backend:
        condition: service_started
      bruttice-frontend:
        condition: service_started
    image: nginx:1.29
    container_name: bruttice-nginx
    restart: always
    init: true
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bruttice

networks:
  bruttice:
