# Overrides docker-compose.yaml for `make up-demo`, see the Makefile.
#
# Its own env file and config, so a local .env and apps/backend/config.yaml are
# neither read nor changed. The database is a volume of the bruttice-demo
# project, so `make clean` removes it.
services:
  bruttice-backend:
    volumes: !override
      - ./demo/config.yaml:/app/config.yaml:ro
      - ./demo/pages:/app/pages:ro
    env_file: !override
      - demo/env

  bruttice-frontend:
    env_file: !override
      - demo/env
    # an example of docs/branding.md: this web manifest is served as /site.webmanifest
    volumes:
      - ./demo/branding:/usr/share/nginx/branding:ro

  bruttice-db:
    env_file: !override
      - demo/env

  # Loads example events through the ingest API and example visitors straight
  # into the database (the POSTGRES_* variables of demo/env), then exits. Safe to
  # run again.
  demo-seed:
    build:
      context: .
      dockerfile: demo/seed.Dockerfile
    depends_on:
      - bruttice-backend
    env_file:
      - demo/env
    environment:
      INGEST_URL: http://bruttice-backend:8080
      INGEST_KEY: demo-ingest-key
      TZ: America/Chicago
    networks:
      - bruttice
