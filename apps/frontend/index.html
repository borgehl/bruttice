<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A community event calendar." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bruttice" />
    <meta property="og:title" content="Bruttice" />
    <meta property="og:description" content="A community event calendar." />
    <meta name="theme-color" content="#12161c" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Bruttice</title>

    <!-- Sets the theme before the app loads, so there is no flash of the wrong one. Keep in sync
         with src/store/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'neon' ? 'neon' : 'info');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'info');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
