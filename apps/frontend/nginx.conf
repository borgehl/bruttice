server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # The build's files carry a hash of their content in the name, so they never change under it and
    # can be kept for a year. A missing one is a 404, not the app.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other file keeps its name when it changes: the icons of a site (docs/branding.md), the
    # images it adds. A short cache lets a changed one reach visitors within the hour.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
    }

    # The web manifest is a file the page links to, so a site without one gets a 404 and not the app.
    # Not cached at all, a site may change its name or colors.
    location = /site.webmanifest {
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
