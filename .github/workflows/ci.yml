name: CI

on:
  # Pushes run only where images are published. Everything else is tested by its pull request.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...
        working-directory: apps/backend

      - name: Vet
        run: go vet ./...
        working-directory: apps/backend

      - name: Test
        run: go test ./...
        working-directory: apps/backend

  test-go-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/go-pkg/go.sum

      - name: Build
        run: go build ./...
        working-directory: packages/go-pkg

      - name: Vet
        run: go vet ./...
        working-directory: packages/go-pkg

      - name: Test
        run: go test ./...
        working-directory: packages/go-pkg

  test-py-ingest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          # the package's version comes from the git tags
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: python -m unittest discover -s tests -t .
        working-directory: packages/py-ingest

      # The package has no version of its own: it is the release tag. This fails the release, before
      # the Go module is tagged, if the tag isn't one setuptools-scm reads.
      - name: Version is the release tag
        if: github.event_name == 'release'
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          pip install setuptools-scm
          python - <<'PY'
          import os, subprocess, sys
          from packaging.version import Version
          built = subprocess.check_output([sys.executable, "-m", "setuptools_scm"], text=True).strip()
          want = os.environ["VERSION"].removeprefix("v")
          if Version(built) != Version(want):
              sys.exit(f"py-ingest builds as {built}, the release tag is {want}")
          print(f"py-ingest {built}")
          PY
        working-directory: packages/py-ingest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pnpm version comes from "packageManager" in apps/frontend/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Test
        run: pnpm test
        working-directory: apps/frontend

  # The production image serves the built site with nginx. This builds it and checks the page as a
  # browser, a search engine or a link preview would get it: any route serves the app, and the
  # title and link preview tags show SITE_NAME with its HTML escaped.
  test-frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t frontend-test apps/frontend

      - name: Run with a site name, and without
        run: |
          docker run -d --name named -p 8081:80 -e SITE_NAME='Tom & "Jerry" <Co>' -e SITE_DESCRIPTION="It's a test | with & pipes" frontend-test
          docker run -d --name plain -p 8082:80 frontend-test
          for port in 8081 8082; do
            for i in $(seq 1 30); do
              curl -fsS "http://localhost:$port/" > /dev/null 2>&1 && break
              sleep 1
            done
          done

      - name: The name and description are in the page
        run: |
          for path in / /about /p/anything; do
            page=$(curl -fsS "http://localhost:8081$path")
            echo "$page" | grep -F '<title>Tom &amp; &quot;Jerry&quot; &lt;Co&gt;</title>'
            echo "$page" | grep -F 'property="og:title" content="Tom &amp; &quot;Jerry&quot; &lt;Co&gt;"'
            echo "$page" | grep -F 'property="og:site_name" content="Tom &amp; &quot;Jerry&quot; &lt;Co&gt;"'
            echo "$page" | grep -F 'name="description" content="It&#39;s a test | with &amp; pipes"'
            echo "$page" | grep -F 'id="root"'
          done

      - name: Without them the defaults stay
        run: |
          curl -fsS http://localhost:8082/ | grep -F '<title>Bruttice</title>'

      - name: A missing asset is a 404, not the app
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/assets/missing.js)" = 404

      - name: Without a branding directory the web manifest is a 404, not the app
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/site.webmanifest)" = 404

      # docs/branding.md: files in /usr/share/nginx/branding are served from the site's root. The
      # symlinked dotfile and the subdirectory stand in for what a Kubernetes ConfigMap mount looks
      # like, and index.html must not replace the page.
      - name: Run with a branding directory
        run: |
          mkdir -p branding/..data branding/sub
          printf '{"name": "Branded"}' > branding/site.webmanifest
          printf 'icon-bytes' > branding/favicon.ico
          printf 'not the page' > branding/index.html
          printf 'hidden' > branding/..data/secret.txt
          printf 'nested' > branding/sub/nested.txt
          docker run -d --name branded -p 8083:80 -e SITE_NAME='Branded Site' -v "$PWD/branding:/usr/share/nginx/branding:ro" frontend-test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8083/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: The branding files are served
        run: |
          test "$(curl -fsS http://localhost:8083/site.webmanifest)" = '{"name": "Branded"}'
          test "$(curl -fsS http://localhost:8083/favicon.ico)" = 'icon-bytes'

      - name: Branding does not replace the page, or copy hidden files and directories
        run: |
          curl -fsS http://localhost:8083/ | grep -F '<title>Branded Site</title>'
          curl -fsS http://localhost:8083/ | grep -F 'id="root"'
          # an unknown route gets the app, so check what was served and not the status
          test "$(curl -s http://localhost:8083/secret.txt)" != 'hidden'
          test "$(curl -s http://localhost:8083/nested.txt)" != 'nested'
          docker logs branded 2>&1 | grep -F 'branding: site.webmanifest'
          docker logs branded 2>&1 | grep -F 'branding: skipping index.html'

      - name: Logs
        if: failure()
        run: |
          docker logs named
          docker logs plain
          docker logs branded

  # Nothing is published, and no release is made, until every test has passed. Each publish job
  # waits for this one rather than for the tests it seems to be about, so a job can't finish early
  # while another test is still running or has failed. Also the one check a pull request needs.
  all-tests-passed:
    needs: [test-backend, test-go-pkg, test-py-ingest, test-frontend, test-frontend-image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all tests passed"

  publish-backend:
    needs: all-tests-passed
    # images are published from main and for releases
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bruttice-backend
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    needs: all-tests-passed
    # images are published from main and for releases
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bruttice-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The example data loader of `make up-demo` (demo/seed.Dockerfile), so a deployment's demo can pull
  # it instead of building it. It is built from the whole repo, the way the Dockerfile expects.
  publish-demo-seed:
    needs: all-tests-passed
    # images are published from main and for releases
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bruttice-demo-seed
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/seed.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A GitHub Release is the one trigger for a version: `gh release create v0.1.0 --generate-notes`.
  # The images above are published with the release tag (v0.1.0, 0.1.0, 0.1). Go resolves a module
  # in a subdirectory from a tag prefixed with its path, so the same version is tagged on
  # packages/go-pkg, which makes `go get github.com/borgehl/bruttice/packages/go-pkg@v0.1.0` work.
  # py-ingest takes its version from the same tag, and is not published to PyPI yet.
  release-go-pkg:
    needs: all-tests-passed
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the Go module
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag '$VERSION' is not a semver version like v1.2.3, so Go can't use it" >&2
            exit 1
          fi

          tag="packages/go-pkg/$VERSION"
          existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -n "$existing" ]; then
            # a re-run of the job. Go caches a tag forever, so it must never move.
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "$tag already exists on another commit ($existing)" >&2
              exit 1
            fi
            echo "$tag already exists on this commit"
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
